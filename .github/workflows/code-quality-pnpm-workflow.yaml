# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Code quality & build checks

# Reusable workflow for code quality and build checks in pnpm projects.
# Consumers must provide a check-command input specifying the command to run.

on:
  workflow_call:
    inputs:
      check-command:
        type: string
        required: true
        description: Command to run code quality and build checks (e.g., "pnpm run ci", "nmr ci")
      node-version:
        type: string
        required: false
        default: ''
        description: |
          Explicit Node.js version. Overrides node-version-file. Leave unset to use the version
          declared in the calling repository's .tool-versions.
      node-version-file:
        type: string
        required: false
        default: '.tool-versions'
        description: |
          Path to a file declaring the Node.js version, relative to the repository root.
          Ignored when node-version is supplied.
      setup-command:
        type: string
        required: false
        default: ''
        description: |
          Optional shell command to run after dependency installation and bootstrap, before the check command.
          Use for installing system dependencies. The consumer is responsible for sudo, package-manager flags,
          and any necessary index updates (e.g., apt-get update).
      shellspec-version:
        type: string
        required: false
        default: ''
        description: |
          Shellspec release to install before the checks run (e.g. "0.28.1"). Leave unset to install
          nothing. The installer comes from the named release's own tag.

jobs:
  code-quality:
    name: Code quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Concurrency is caller-owned: declare it at the caller's workflow level (see README).
    # A job-level group here is shared across a caller's matrix legs and cancels them.

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # pnpm version is governed by each consumer's `packageManager` field in package.json.
      - name: Enable corepack
        run: corepack enable

      # An explicit node-version overrides the file, matching actions/setup-node's own precedence.
      # The file is blanked in that case so setup-node does not warn about conflicting inputs.
      # Keep '' as the last operand: GitHub expressions return operand values, so a falsy middle
      # operand falls through and the precedence silently inverts.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          node-version-file: ${{ inputs.node-version == '' && inputs.node-version-file || '' }}
          cache: 'pnpm'

      # shellspec is not in apt. Fetching install.sh from the named release's own tag keeps the
      # installer and the code it installs one reviewed snapshot, and leaves no shellspec version
      # pinned here. The installer's default prefix is $HOME/.local, so no sudo is needed.
      - name: Install shellspec
        if: inputs.shellspec-version != ''
        env:
          SHELLSPEC_VERSION: ${{ inputs.shellspec-version }}
        run: |
          installer="$RUNNER_TEMP/shellspec-install.sh"
          curl --fail --silent --show-error --location --retry 3 --output "$installer" \
            "https://raw.githubusercontent.com/shellspec/shellspec/$SHELLSPEC_VERSION/install.sh"
          # --yes is required: the installer's confirm prompt reads /dev/tty, which a step has none of.
          sh "$installer" "$SHELLSPEC_VERSION" --yes
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # $GITHUB_PATH takes effect in later steps, so verify through the absolute path.
          "$HOME/.local/bin/shellspec" --version

      - name: Install dependencies
        run: pnpm install

      - name: Bootstrap
        run: pnpm run --if-present bootstrap

      - name: Run setup command
        if: inputs.setup-command != ''
        env:
          SETUP_COMMAND: ${{ inputs.setup-command }}
        run: bash -eo pipefail -c "$SETUP_COMMAND"

      - name: Run code quality & build checks
        run: ${{ inputs.check-command }}
