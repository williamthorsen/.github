# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Test code-quality-pnpm-workflow

# Self-test for the reusable code-quality workflow.
# Verifies that the setup-command input installs a tool that the check-command then uses,
# that a caller-side Node-version matrix runs every leg to completion,
# that the Node version resolves from .tool-versions unless node-version overrides it or
# node-version-file names another path,
# that shellspec-version installs shellspec for the check command only when it is set,
# that lint-workflows: false skips the actionlint step, that check-commands runs one job per entry
# under the entry's name with actionlint in one leg only, that a check-command caller's job keeps
# the name "Code quality", that runs-on moves every job to the runner it names, as a bare
# label, a JSON label, or a JSON array, and that a Prettier cache saved by one call is restored by
# a later call and saved only when the checks changed it. Every other job lints this repository's
# own workflows with the step on, and runs on the default runner.
#
# The missing-.tool-versions failure path is deliberately uncovered: continue-on-error is not
# supported on jobs that call a reusable workflow, so a call expected to fail cannot be asserted.
# The same limitation leaves the clash between shellspec-version and a hand-rolled installer in
# setup-command uncovered; the README's migration note carries it instead. The same limitation
# leaves uncovered a run that fails on an actionlint error, the input validation's failures, and
# fail-fast: false keeping a failing leg from cancelling the others.
#
# The runs-on runner-group form is uncovered because hosted runner groups require paid larger
# runners, and the CI_RUNS_ON variable is uncovered because setting it would move every job here.
# The variable reaches the same parsing as the input. The group form's { branch is not exercised.
#
# Concurrency is declared here at the workflow level — the pattern consumers should follow
# now that the reusable workflow no longer manages it.

on:
  pull_request:
    paths:
      - '.github/fixtures/**'
      - '.github/workflows/code-quality-pnpm-workflow.yaml'
      - '.github/workflows/code-quality-pnpm.test.yaml'
      - '.tool-versions'
  push:
    branches: [main]
    paths:
      - '.github/fixtures/**'
      - '.github/workflows/code-quality-pnpm-workflow.yaml'
      - '.github/workflows/code-quality-pnpm.test.yaml'
      - '.tool-versions'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup-command-installs-ripgrep:
    name: setup-command installs ripgrep
    uses: ./.github/workflows/code-quality-pnpm-workflow.yaml
    with:
      setup-command: 'sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep'
      check-command: 'rg --version'

  default-path-no-setup-command:
    name: default path (no setup-command) succeeds
    uses: ./.github/workflows/code-quality-pnpm-workflow.yaml
    with:
      check-command: ':'

  matrix-runs-all-legs:
    name: matrix runs all legs (node ${{ matrix.node-version }})
    strategy:
      matrix:
        node-version: ['24.17.0', '24.18.0']
    uses: ./.github/workflows/code-quality-pnpm-workflow.yaml
    with:
      node-version: ${{ matrix.node-version }}
      check-command: 'node --version'

  # The expected version is read from .tool-versions at run time. Hardcoding it here would
  # restate the version in a second place, which is the defect this workflow input removes.
  default-reads-tool-versions:
    name: default resolves Node from .tool-versions
    uses: ./.github/workflows/code-quality-pnpm-workflow.yaml
    with:
      check-command: >-
        test "$(node --version)" = "v$(sed -n 's/^nodejs //p' .tool-versions)"

  # Exercises precedence against the default file, which this repository has.
  node-version-overrides-file:
    name: node-version overrides .tool-versions
    uses: ./.github/workflows/code-quality-pnpm-workflow.yaml
    with:
      node-version: '24.17.0'
      check-command: 'test "$(node --version)" = "v24.17.0"'

  # The fixture declares a version .tool-versions does not, so this passes only if the input
  # reaches setup-node. A node-version-file hardcoded to the default would fail here.
  node-version-file-reads-given-path:
    name: node-version-file reads the path it is given
    uses: ./.github/workflows/code-quality-pnpm-workflow.yaml
    with:
      node-version-file: '.github/fixtures/.node-version'
      check-command: 'test "$(node --version)" = "v24.17.0"'

  # Asserts the installed release is the requested one and that `shellspec` resolves for the check
  # command. $HOME/.local/bin is on the hosted runner's default PATH, so this does not cover the
  # install step's $GITHUB_PATH entry.
  shellspec-version-installs-requested-version:
    name: shellspec-version installs the requested version
    uses: ./.github/workflows/code-quality-pnpm-workflow.yaml
    with:
      shellspec-version: '0.28.1'
      check-command: 'test "$(shellspec --version)" = "0.28.1"'

  omitted-shellspec-version-installs-nothing:
    name: omitted shellspec-version installs nothing
    uses: ./.github/workflows/code-quality-pnpm-workflow.yaml
    with:
      check-command: '! command -v shellspec'

  # setup-command writes a workflow that actionlint rejects (runner context in a job-level env), so
  # this passes only if the lint step is skipped. GitHub evaluates an expression opener anywhere in a
  # with: value, so the shell joins the adjacent quoted strings '$' and '{{ runner.temp }}' instead.
  lint-workflows-false-skips-lint:
    name: lint-workflows false skips the lint step
    uses: ./.github/workflows/code-quality-pnpm-workflow.yaml
    with:
      lint-workflows: false
      setup-command: >-
        printf '%s\n'
        'on: push'
        'jobs:'
        '  build:'
        '    runs-on: ubuntu-latest'
        '    env:'
        '      CACHE_DIR: ''$''{{ runner.temp }}'
        '    steps:'
        '      - run: echo "$CACHE_DIR"'
        > .github/workflows/broken.yaml
      check-command: ':'

  # The JSON uses the README's documented form, so the self-test exercises the copyable example.
  # The second command chains several steps, as a leg replacing a composite script does.
  check-commands-fans-out:
    name: check-commands fans out
    uses: ./.github/workflows/code-quality-pnpm-workflow.yaml
    with:
      check-commands: >-
        [
          { "name": "first", "command": "test -f package.json" },
          { "name": "second", "command": "node --version && test -f .tool-versions && :" }
        ]

  # RUNNER_ARCH tells the hosted Arm runner apart from the ubuntu-latest default.
  runs-on-bare-label-selects-runner:
    name: runs-on bare label selects the runner
    uses: ./.github/workflows/code-quality-pnpm-workflow.yaml
    with:
      runs-on: 'ubuntu-24.04-arm'
      check-command: 'test "$RUNNER_ARCH" = ARM64'

  # The JSON label is the form that workflows reading CI_RUNS_ON with fromJSON alone require.
  runs-on-json-label-selects-runner:
    name: runs-on JSON label selects the runner
    uses: ./.github/workflows/code-quality-pnpm-workflow.yaml
    with:
      runs-on: '"ubuntu-24.04-arm"'
      check-command: 'test "$RUNNER_ARCH" = ARM64'

  runs-on-array-reaches-every-leg:
    name: runs-on array reaches every leg
    uses: ./.github/workflows/code-quality-pnpm-workflow.yaml
    with:
      runs-on: '["ubuntu-24.04-arm"]'
      check-commands: >-
        [
          { "name": "first", "command": "test \"$RUNNER_ARCH\" = ARM64" },
          { "name": "second", "command": "test \"$RUNNER_ARCH\" = ARM64" }
        ]

  # Reads the names GitHub recorded, which callers' branch protection matches against. Reading by
  # attempt keeps a re-run from passing on the previous attempt's jobs.
  check-names-follow-entries:
    name: check names follow entries
    needs: [check-commands-fans-out, default-path-no-setup-command]
    runs-on: ubuntu-latest
    permissions:
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Assert job names and a single lint leg
        run: |
          jobs="$RUNNER_TEMP/jobs.json"
          gh api --paginate --jq '.jobs[]' \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" \
            > "$jobs"
          for name in \
            'check-commands fans out / first' \
            'check-commands fans out / second' \
            'default path (no setup-command) succeeds / Code quality'; do
            if ! jq --exit-status --arg name "$name" 'select(.name == $name)' "$jobs" > /dev/null; then
              echo "::error::Missing job: $name"
              exit 1
            fi
          done
          lint=$(jq --raw-output \
            'select(.name | startswith("check-commands fans out / ")) | .steps[] | select(.name == "Lint workflows") | .conclusion' \
            "$jobs" | sort | paste -sd, -)
          if [ "$lint" != 'skipped,success' ]; then
            echo "::error::Lint workflows conclusions across the legs: $lint"
            exit 1
          fi

  # Seeds the cache directory directly, so the round trip does not depend on the caller's nmr. The
  # run-specific content keeps a cache left by an earlier run from satisfying the restore check.
  prettier-cache-saves:
    name: prettier cache saves
    uses: ./.github/workflows/code-quality-pnpm-workflow.yaml
    with:
      check-command: >-
        mkdir -p node_modules/.cache/prettier/nmr-fmt &&
        echo "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" > node_modules/.cache/prettier/nmr-fmt/marker

  prettier-cache-restores:
    name: prettier cache restores
    needs: prettier-cache-saves
    uses: ./.github/workflows/code-quality-pnpm-workflow.yaml
    with:
      check-command: >-
        test "$(cat node_modules/.cache/prettier/nmr-fmt/marker)" = "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

  # The seeding call changed the cache and must save it; the restoring call and a call whose
  # check command does not touch the cache leave it unchanged and must skip the save.
  prettier-cache-saves-only-changes:
    name: prettier cache saves only changes
    needs: [default-path-no-setup-command, prettier-cache-restores]
    runs-on: ubuntu-latest
    permissions:
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Assert save-step conclusions
        run: |
          jobs="$RUNNER_TEMP/jobs.json"
          gh api --paginate --jq '.jobs[]' \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" \
            > "$jobs"
          for expectation in \
            'prettier cache saves / Code quality=success' \
            'prettier cache restores / Code quality=skipped' \
            'default path (no setup-command) succeeds / Code quality=skipped'; do
            name="${expectation%=*}"
            expected="${expectation##*=}"
            actual=$(jq --raw-output --arg name "$name" \
              'select(.name == $name) | .steps[] | select(.name == "Save Prettier cache") | .conclusion' \
              "$jobs")
            if [ "$actual" != "$expected" ]; then
              echo "::error::Save Prettier cache in '$name': expected $expected, got '${actual:-missing}'"
              exit 1
            fi
          done
